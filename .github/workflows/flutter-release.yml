name: Build Flutter Rider APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "assets/**"
      - ".github/workflows/flutter-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.7"
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          java -version
          grep -E "distributionUrl|com.android.application" android/gradle/wrapper/gradle-wrapper.properties android/settings.gradle.kts || true

      - name: Decode and convert release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/app/release-input.keystore
          SIZE=$(wc -c < android/app/release-input.keystore | tr -d ' ')
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::Decoded keystore too small (${SIZE} bytes)."
            exit 1
          fi
          keytool -importkeystore -noprompt \
            -srckeystore android/app/release-input.keystore \
            -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -destkeystore android/app/release.keystore \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS"
          rm -f android/app/release-input.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Print signing fingerprints
        run: |
          echo "## Signing fingerprints" >> $GITHUB_STEP_SUMMARY
          keytool -list -v \
            -keystore android/app/release.keystore \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            | grep -E "SHA1|SHA256" | tee -a $GITHUB_STEP_SUMMARY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pharma-rider-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pharma-rider-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
